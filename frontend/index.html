<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <title>Packing App</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <h2>Kolejki</h2>
      <ul>
        <li class="queue-item active" data-queue="pending">
          Oczekujące <span id="count-pending" class="badge">0</span>
        </li>
        <li class="queue-item" data-queue="picking">
          Kompletowanie <span id="count-picking" class="badge">0</span>
        </li>
        <li class="queue-item" data-queue="packing">
          Pakowanie <span id="count-packing" class="badge">0</span>
        </li>
        <li class="queue-item" data-queue="done">
          Gotowe <span id="count-done" class="badge">0</span>
        </li>
      </ul>
      <hr />
      <button id="btn-sync">↻ Pobierz zamówienia</button>
      <button id="btn-auth">Autoryzuj Allegro</button>
      <button id="btn-zakoncz">Zakończ dzień</button>
      <button id="btn-settings">⚙ Ustawienia</button>
      <button id="btn-seed" style="opacity:0.5;font-size:11px">+ Testowe zamówienia</button>
    </aside>

    <main id="content">
      <!-- Filled by app.js -->
    </main>
  </div>


<script src="/static/app.js"></script>
</body>
</html>
