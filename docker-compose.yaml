services:
  packing-sync:
    build:
      context: .
      dockerfile: Dockerfile
    profiles: [sync]
    restart: unless-stopped
    env_file: .env
    environment:
      PACKING_API_URL: http://packing:3001
      PACKING_SYNC_INTERVAL: ${PACKING_SYNC_INTERVAL:-300}
    command: [python, -m, mcp_server, sync-loop]
    depends_on:
      packing:
        condition: service_healthy
    healthcheck:
      disable: true

  packing:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: "packing"
    restart: "always"
    env_file: .env
    environment:
      PACKING_ENV_FILE: /app/.env
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - "./data:/app/data"
      - type: bind
        source: ./.env
        target: /app/.env
        bind:
          create_host_path: false
